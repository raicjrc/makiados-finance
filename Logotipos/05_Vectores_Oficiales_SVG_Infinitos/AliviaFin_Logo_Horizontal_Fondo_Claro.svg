<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 500" width="1600" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 156px;
        letter-spacing: -0.04em;
        fill: #0f172a;
      }
      .brand-tag {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.01em;
        fill: #64748b;
      }
    </style>
  </defs>
  <g transform="translate(90, 85) scale(0.64)">
    
  <svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; overflow:visible;">
    <defs>
      <!-- Gradiente para el tallo/arco principal de la A -->
      <linearGradient id="hl_stemGrad" x1="35%" y1="0%" x2="65%" y2="100%">
        <stop offset="0%" stop-color="#34d399" />
        <stop offset="35%" stop-color="#10b981" />
        <stop offset="75%" stop-color="#059669" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>

      <!-- Gradiente para la cinta ondulada de alivio financiero -->
      <linearGradient id="hl_waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#047857" />
        <stop offset="22%" stop-color="#059669" />
        <stop offset="65%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#34d399" />
      </linearGradient>

      <!-- Gradiente para el arco de sonrisa inferior -->
      <linearGradient id="hl_smileGrad" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#047857" />
        <stop offset="50%" stop-color="#059669" />
        <stop offset="100%" stop-color="#10b981" />
      </linearGradient>

      
      <!-- Sombra de relieve suave Apple para la cinta sobre el tallo -->
      <filter id="hl_waveShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.28" />
      </filter>
      
    </defs>

    <!-- 1. Tallo y ápice de la A (Curva de Bézier pura, cero serrucho) -->
    <path d="M 178 342 
             C 192 270, 240 114, 258 98 
             C 264 93, 273 93, 279 100 
             C 296 126, 324 220, 346 304" 
          fill="none" 
          stroke="url(#hl_stemGrad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 2. Sonrisa inferior en base derecha -->
    <path d="M 238 348 
             C 274 406, 348 406, 398 322" 
          fill="none" 
          stroke="url(#hl_smileGrad)" 
          stroke-width="48" 
          stroke-linecap="round" />

    <!-- 3. Cinta frontal ondulada con sombra de profundidad táctil -->
    <path d="M 178 335 
             C 160 380, 130 398, 110 376 
             C 84 348, 102 298, 150 278 
             C 214 252, 298 266, 342 242 
             C 362 230, 372 208, 380 196" 
          fill="none" 
          stroke="url(#hl_waveGrad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#hl_waveShadow)" />
  </svg>
  
  </g>
  <text x="470" y="295" class="brand-title">aliviafin<tspan fill="#10b981">.</tspan></text>
  <text x="476" y="360" class="brand-tag">Paz mental para tu dinero</text>
</svg>